# Sponsorship configuration for the GitHub repo.
#
# When any line below is uncommented and populated, GitHub renders a
# "Sponsor" button on the repository home page that links to the
# corresponding platform. Multiple platforms can be active at once.
#
# All entries below are intentionally commented out — uncomment and fill
# in the platform(s) you actually have when you're ready. Leaving the
# file present (even fully commented) signals to recruiters and
# evaluators that the repo is run with intent.
#
# Reference: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository

github: MA1002643 # GitHub Sponsors username — requires Sponsors enrolment.
patreon: <patreon-username> # Patreon username (no URL prefix).
open_collective: <oc-slug> # Open Collective slug.
ko_fi: <ko-fi-name> # Ko-fi username.
tidelift: <platform>/<package> # Tidelift package, e.g. npm/some-package.
community_bridge: <project-name> # Linux Foundation Crowdfunding project.
liberapay: <liberapay-username> # Liberapay username.
issuehunt: <issuehunt-username> # IssueHunt username.
lfx_crowdfunding: <project-name> # LFX Crowdfunding project name.
polar: <polar-username> # Polar.sh username.
buy_me_a_coffee: <bmc-username> # Buy Me a Coffee username.
thanks_dev: <thanks.dev-username> # thanks.dev username.
custom: # Up to 4 arbitrary URLs (PayPal, your own donation page, etc.)
  - 'https://ma.codes/sponsor'
