# Dependency updates (issue #92, L9). Weekly and GROUPED, so the PR queue is a
# handful of reviewable batches rather than a daily drip of one-line bumps that
# train everyone to merge without reading.
#
# Majors are left out of the groups on purpose: Next 14 → 15 and nodemailer
# 7 → 10 (both done 2026-10-11) were migrations with their own code changes,
# not something to rubber-stamp in a batch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # Tailwind 3 → 4 is a migration (CSS-first config, a new PostCSS
      # plugin, renamed utility scales), not a bump. PR #169 merged it as a
      # bump and broke every build on 2026-10-18. Remove this entry when
      # that migration is done on its own branch.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # three.js is 0.x: each r-release is a "minor" to semver and to the
      # grouping above, but it can break. r162 → r186 rode in on the
      # production minor-and-patch batch (#162) and hung every project page
      # on the mobile-chrome E2E (the WebGL scene starved the main thread);
      # back on r162 the same suite passed 59/59. Patches still arrive.
      # Upgrade three on its own branch, then remove this entry.
      - dependency-name: three
        update-types: [version-update:semver-minor, version-update:semver-major]
      # ESLint 10 can't install yet: eslint-plugin-jsx-a11y 6.10.2 and
      # eslint-plugin-react 7.37.5 (both pulled in by eslint-config-next too)
      # cap their eslint peer at ^9, so npm stops with ERESOLVE. PR #182 broke
      # the Vercel build that way on 2026-11-02. Remove this entry once both
      # plugins publish an eslint 10 peer range.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7 (the native port) can't lint yet: typescript-eslint
      # 8.72.2, pulled in by eslint-config-next, peers on typescript <6.1.0
      # and exits with "typescript-eslint does not support TS 7.0", which
      # failed the Lint job on PR #209 (2026-11-09). Remove this entry once
      # typescript-eslint publishes a TS 7 peer range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area:ci]
    groups:
      # Minor and patch only, as for npm above: a major action release (a new
      # Node runtime, renamed inputs) arrives as its own PR, not in the batch.
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
