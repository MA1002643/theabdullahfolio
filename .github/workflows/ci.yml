name: CI

# The PR gate (issue #92). One workflow, parallel jobs, one shared build:
#
#   lint ─────────────┐
#   vitest ───────────┤  (unit · property · fitness · component · api + coverage)
#   build ──┬─ bundle ┤  (client-bundle secret scan · first-load JS budget)
#           ├─ e2e ───┤  (chromium · mobile-chrome, sharded as a matrix)
#           ├─ quality┤  (a11y · security · perf · visual)
#           └─ burn-in┘  (PRs only: every CHANGED spec × 5, to catch a flake before it merges)
#
# Every job writes its own section of the run summary, and every browser job
# uploads its report and traces when it fails. docs/testing.md is the map.
# The full engine matrix (webkit, firefox, mobile-safari) and mutation testing
# run nightly (nightly.yml); CodeQL, OSV and Gitleaks run in security.yml.

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'test/**'
  pull_request:
    branches:
      - main
  # Raised by visual-baselines.yml after it commits screenshots: that commit is
  # pushed with GITHUB_TOKEN, which starts no push run, and would otherwise
  # head the branch with no checks.
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job, declared rather than inherited from the
# repository default. Nothing here writes back to the repository.
permissions:
  contents: read

env:
  # Node 22 is the minimum the dependency tree supports: a transitive dep
  # (`ai` -> `@ai-sdk/gateway@4.x`) requires >=22 and `.npmrc` sets
  # engine-strict, so `npm ci` hard-fails on anything older (EBADENGINE).
  NODE_VERSION: '22'
  # Non-secret stubs so module evaluation does not fail on an absent variable.
  # None is a credential. Kept identical across the build and every job that
  # boots the production server, because both evaluate the same modules.
  NEXT_PUBLIC_GITHUB_USERNAME: MA1002643
  SMTP_HOST: smtp.example.com
  SMTP_PORT: '587'
  SMTP_USER: ci@example.com
  SMTP_PASS: placeholder
  RECEIVER_EMAIL: ci@example.com
  AUTH_GITHUB_ID: ci-placeholder
  AUTH_GITHUB_SECRET: ci-placeholder
  AUTH_GOOGLE_ID: ci-placeholder
  AUTH_GOOGLE_SECRET: ci-placeholder

jobs:
  lint:
    name: Lint (ESLint + full jsx-a11y)
    runs-on: ubuntu-latest
    # Honor [skip ci] in commit messages (e.g. bot-authored README sync commits).
    # head_commit is null for pull_request events, so PR CI is unaffected.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # /uses publishes the browser-test count from tests/browser-cases.json
      # (Playwright's own collected list; the spec text undercounts generated
      # tests). This fails a PR that adds or removes browser tests without
      # regenerating it: run `npm run test:count` and commit the file. Listing
      # starts no browser and no server, so the lint job can do it.
      - name: Browser-test count is current
        run: node scripts/count-browser-cases.mjs --check

  vitest:
    name: Vitest (unit · property · fitness · component · api)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    # Job-level so the Codecov step's `if:` can see it (a step's own `env` is
    # not in scope for that step's condition).
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Coverage thresholds are enforced by vitest.config.mjs, so a drop fails
      # this step. JUnit output feeds the summary below.
      - name: Run every Vitest project with coverage
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
      - name: Summarise
        if: always()
        run: node scripts/test-summary.mjs vitest
      # Codecov is optional: without the CODECOV_TOKEN repo secret the upload is
      # skipped rather than failed, and the summary above already carries the
      # numbers. With it, PRs get a coverage-delta comment.
      - name: Upload coverage to Codecov
        if: ${{ always() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build (production)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The one REAL credential in this workflow, and the reason the bundle
          # scan below means something: if any code path inlined it into client
          # output, the scan finds its value there.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Client-bundle secret scan
        run: node scripts/scan-client-bundle.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: First-load JS budget
        run: node scripts/check-bundle-budget.mjs
      # One build, shared by every browser job below. `include-hidden-files`
      # is REQUIRED: the output lives in `.next.nosync` (next.config.mjs), and
      # upload-artifact@v4 silently skips dot-directories without it.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next.nosync
            !.next.nosync/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next.nosync
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run
        run: npx playwright test --project=${{ matrix.project }}
      - name: Summarise
        if: always()
        run: node scripts/test-summary.mjs playwright "E2E · ${{ matrix.project }}"
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  quality:
    name: Browser quality (a11y · security · perf · visual)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next.nosync
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run a11y, security and perf
        id: quality
        run: npx playwright test --project=a11y --project=security --project=perf
      # Visual regression compares against baselines rendered on this same
      # runner type by the "Visual baselines" workflow. The project arms itself
      # only once they are committed (playwright.config.mjs), so this step runs
      # only then; before that it is skipped, visibly, in the job's step list.
      #
      # A second Playwright run here would overwrite the first one's JUnit file,
      # HTML report and test-results/ (Playwright empties its output directory
      # at start), so the summary reported only the visual tests and a failed
      # a11y run lost its traces. The visual run gets its own of all three, and
      # `always()` so a failed a11y run still gets its visual comparison.
      - name: Run visual regression
        id: visual
        if: ${{ always() && hashFiles('tests/visual/__screenshots__/**/*.png') != '' }}
        run: npx playwright test --project=visual --output=test-results-visual
        env:
          PLAYWRIGHT_JUNIT_FILE: test-results-visual/playwright-junit.xml
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-visual
      - name: Summarise a11y, security and perf
        if: ${{ always() && steps.quality.outcome != 'skipped' }}
        run: node scripts/test-summary.mjs playwright "Browser quality · a11y, security, perf"
      - name: Summarise visual regression
        if: ${{ always() && steps.visual.outcome != 'skipped' }}
        run: node scripts/test-summary.mjs playwright "Browser quality · visual" test-results-visual/playwright-junit.xml
      - name: Upload report, traces and visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-quality
          path: |
            playwright-report/
            test-results/
            playwright-report-visual/
            test-results-visual/
          retention-days: 7

  burn-in:
    name: Flake burn-in (changed specs × 5)
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find changed browser specs
        id: changed
        run: |
          specs=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'tests/**/*.spec.js' | tr '\n' ' ')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          if [ -z "$specs" ]; then echo "No browser spec changed; nothing to burn in." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-node@v6
        if: ${{ steps.changed.outputs.specs != '' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: ${{ steps.changed.outputs.specs != '' }}
        run: npm ci
      - uses: actions/download-artifact@v4
        if: ${{ steps.changed.outputs.specs != '' }}
        with:
          name: next-build
          path: .next.nosync
      - if: ${{ steps.changed.outputs.specs != '' }}
        run: npx playwright install --with-deps chromium
      # Five repeats with NO retries: a test that passes 4 of 5 is flaky, and
      # a flaky test is cheapest to fix before it merges, while its author
      # still remembers writing it.
      - name: Burn in
        if: ${{ steps.changed.outputs.specs != '' }}
        run: npx playwright test ${{ steps.changed.outputs.specs }} --project=chromium --project=a11y --project=security --project=perf --repeat-each=5 --retries=0
