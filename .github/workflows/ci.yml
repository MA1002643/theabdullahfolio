name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    # Honor [skip ci] in commit messages (e.g. bot-authored README sync commits).
    # head_commit is null for pull_request events, so PR CI is unaffected.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    strategy:
      matrix:
        # Node 18 went EOL in April 2025. Node 20 is no longer installable
        # either: a transitive dep (`ai` -> `@ai-sdk/gateway@4.x`) requires
        # `node >=22`, and `.npmrc` sets `engine-strict=true`, so `npm ci`
        # hard-fails on Node 20 (EBADENGINE). Node 22 is the current LTS and
        # the minimum the dependency tree supports.
        node-version: ['22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        run: npm run lint

      # Unit suite (vitest): the grammar, the drivers, the rate limiters, the
      # presence route, the pad geometry, the palette hook. Before the build
      # because it is fast and most regressions land here first.
      - name: Unit tests
        id: unit
        run: npm test

      - name: Build
        id: build
        run: npm run build
        env:
          # Stub secrets so the build does not fail on missing env vars.
          # Names must match src/app/api/send-mail/route.js and github-stats/route.js.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_GITHUB_USERNAME: MA1002643
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: ci@example.com
          SMTP_PASS: placeholder
          RECEIVER_EMAIL: ci@example.com

      # E2E gate (Playwright). The `test:e2e` script chains `npm run build` so
      # a clean local checkout works; here the Build step above has already
      # produced the output the production server boots from, so Playwright
      # runs directly rather than building twice. playwright.config.mjs boots
      # `next start` on port 3100 with the Redis credential names emptied, an
      # AUTH_SECRET minted fresh for the run (random bytes at config load —
      # no committed value, the specs never sign in) and the json file store
      # unlocked through its e2e-only hatch (a served production refuses it
      # otherwise) — nothing in this job touches a live service, and
      # `reuseExistingServer` is off unless opted into.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        id: e2e
        run: npx playwright test --reporter=list,html
        env:
          # Same non-secret stubs the Build step got (the server evaluates the
          # same modules), plus placeholder OAuth client ids so Auth.js boots —
          # the specs only ever read the UNAUTHENTICATED session, or stub it
          # at the network layer. None of these is a credential.
          NEXT_PUBLIC_GITHUB_USERNAME: MA1002643
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: ci@example.com
          SMTP_PASS: placeholder
          RECEIVER_EMAIL: ci@example.com
          AUTH_GITHUB_ID: ci-placeholder
          AUTH_GITHUB_SECRET: ci-placeholder
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder

      - name: Upload Playwright report
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7

      - name: Write job summary
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅ passed" ;;
              failure) echo "❌ failed" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "🚫 cancelled" ;;
              *) echo "— not run" ;;
            esac
          }
          {
            echo "### CI result — Node ${{ matrix.node-version }}"
            echo ""
            echo "| Step   | Status |"
            echo "|--------|--------|"
            echo "| Lint   | $(status_icon "$LINT_OUTCOME") |"
            echo "| Unit   | $(status_icon "$UNIT_OUTCOME") |"
            echo "| Build  | $(status_icon "$BUILD_OUTCOME") |"
            echo "| E2E    | $(status_icon "$E2E_OUTCOME") |"
          } >> "$GITHUB_STEP_SUMMARY"
