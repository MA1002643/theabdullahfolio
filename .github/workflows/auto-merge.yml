name: Enable Auto-Merge

# Issue #22 / §12 — flips on auto-merge for every PR opened against main, so
# once status checks pass and required reviewers approve, GitHub merges the PR
# without a manual click. Branch-protection rules still apply: this only ARMS
# auto-merge, it does not bypass review/check requirements.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Least-privilege: `enableAutoMerge` is a PR-level mutation and only needs
# `pull-requests: write`. Dropping `contents: write` denies the token the
# ability to push commits, modify files, or cut releases — actions this
# workflow never performs — shrinking the blast radius if the token is ever
# compromised through a malicious dependency or pull_request_target misuse.
permissions:
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      # Pinned to the SHA that the `v7` tag resolved to (latest v7.x at time of
      # pinning). Immutable SHA refs prevent a hijacked tag from injecting code
      # into this workflow; bump alongside any future v7 → v8/v9 upgrade.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            try {
              await github.rest.pulls.enableAutoMerge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                merge_method: "squash",
              });
              core.info(`Auto-merge enabled on #${context.payload.pull_request.number}`);
            } catch (err) {
              // Most common cause: repo has auto-merge disabled at the org/repo
              // level, or branch protection is not configured. Surface the
              // failure but do not fail the workflow run.
              core.warning(`Could not enable auto-merge: ${err.message}`);
            }
