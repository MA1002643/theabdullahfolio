name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  # ffmpeg-static (a devDependency used only by the local asset scripts in
  # scripts/scene/) downloads a ~70 MB binary from GitHub Releases in its
  # install step. CI never runs ffmpeg, and a Releases outage (504s on
  # 2026-11-08) failed `npm ci` in every job. Naming an existing file here makes
  # its installer report "installed already" and skip the download.
  # tests/fitness/ciInstallHermetic.test.js keeps every workflow that installs
  # dependencies setting it.
  FFMPEG_BIN: /usr/bin/true

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint . --max-warnings 0 || true

      - name: Build check
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high || true
