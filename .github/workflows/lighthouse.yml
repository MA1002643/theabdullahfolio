name: Lighthouse

# Per-route quality budgets (issue #32). docs/seo.md §12 recorded this as NOT
# BUILT because per-route budgets need a measured baseline and none existed.
# One exists now — accessibility, best-practices and SEO all measure 100 on the
# four routes lighthouserc.json collects — so the thresholds here are recorded
# facts rather than aspirations. The reasoning behind which of them fail the
# build and which only warn lives in that file, next to the numbers.
#
# ── Why this is a SEPARATE workflow and not a job in ci.yml ─────────────────
# Three reasons, in order:
#
#   • It is slow. Three runs across four routes, each with its own Chrome
#     launch, is minutes — and ci.yml is the gate people wait on before merging.
#   • It needs Chrome. ci.yml installs Chromium for Playwright already, but
#     bundling the two would make a Lighthouse flake look like an e2e failure.
#   • It is scoped differently. This is about the PUBLISHED surface, so it runs
#     on main, not on every push to every feature branch.
#
# ── On a pull request, only when asked (2026-10-17) ─────────────────────────
# A run is about 40 billed minutes (six routes × three runs; the long note and
# the footer pages take minutes each), and Actions minutes on this private
# repository are billed past the free allowance. Running it on every push to a
# PR spent the month's allowance. Add the `lighthouse` label to a PR to audit
# it: labelling runs it once, and every later push re-runs it while the label
# stays. Every merge to main is still audited.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  # Manual runs, so a baseline can be re-measured deliberately after a change
  # to the routes collected or the preset used — without waiting for a PR.
  workflow_dispatch:

jobs:
  audit:
    name: Budgets
    runs-on: ubuntu-latest
    # Least privilege, declared rather than inherited. Without this block the
    # job receives whatever the repository's default token scope happens to be
    # — a setting that lives in the GitHub UI, applies to every workflow at
    # once, and can be widened by someone who never reads this file. This job
    # reads the tree, builds it and uploads an artifact; it writes nothing back.
    # `contents: read` is also all the build step's `secrets.GITHUB_TOKEN`
    # needs, since the repo/stats reads it performs are of public data.
    permissions:
      contents: read
    # On a PR, only with the `lighthouse` label (see the header); a `labeled`
    # event for any other label is ignored too.
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip ci]')
        && (github.event_name != 'pull_request'
          || (contains(github.event.pull_request.labels.*.name, 'lighthouse')
            && (github.event.action != 'labeled' || github.event.label.name == 'lighthouse'))) }}
    # On the JOB, not the workflow: the job's `if` is evaluated first, and a
    # job it skips never joins the group. At workflow level every run
    # joined it, so adding any OTHER label to a PR mid-audit started a run that
    # cancelled the audit and then skipped its own (the label was not
    # `lighthouse`), leaving no measurement at all (code review). A new push
    # still cancels a stale audit, since that run's job does pass `if`.
    concurrency:
      group: lighthouse-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # `actions/checkout` writes the job token into `.git/config` by
          # default, where it stays readable on disk for the remainder of the
          # job — across `npm ci` and `next build`, both of which execute a
          # large tree of third-party code. Nothing here pushes, tags or opens
          # a PR, so the credential has no reason to outlive the clone.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Matched to ci.yml, and for the same reason: `.npmrc` sets
          # engine-strict and a transitive dependency requires >=22.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The same non-secret stubs ci.yml's build step uses. None is a
          # credential; they exist so module evaluation does not fail on an
          # absent variable. Kept in step with ci.yml by hand — if that list
          # changes, this one changes with it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_GITHUB_USERNAME: MA1002643
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: ci@example.com
          SMTP_PASS: placeholder
          RECEIVER_EMAIL: ci@example.com

      # `autorun` performs collect → assert → upload in one pass, reading every
      # setting from lighthouserc.json. It boots the production server itself
      # via `startServerCommand`, so nothing here needs to manage a background
      # process or poll a port.
      - name: Lighthouse CI
        id: lhci
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          NEXT_PUBLIC_GITHUB_USERNAME: MA1002643
          SMTP_HOST: smtp.example.com
          SMTP_PORT: '587'
          SMTP_USER: ci@example.com
          SMTP_PASS: placeholder
          RECEIVER_EMAIL: ci@example.com
          AUTH_GITHUB_ID: ci-placeholder
          AUTH_GITHUB_SECRET: ci-placeholder
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder
          # Deliberately NOT set: NEXT_PUBLIC_GA_MEASUREMENT_ID. A CI audit must
          # not report page views into the production analytics property, and
          # leaving it unset is what makes GoogleAnalytics render nothing (see
          # the component's unset-id path).

      # `always()`: the reports are at their most useful on the run that FAILED,
      # which is exactly the run a default `if: success()` would skip.
      - name: Upload Lighthouse reports
        if: ${{ always() && steps.lhci.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
